name: Probe Vinculum lot-level API
on:
  workflow_dispatch:
    inputs:
      skus: { description: "comma-separated SKUs", default: "ROP2603FUXL,RO2603FUXL" }
      locs: { description: "comma-separated locations", default: "MNW,MWH" }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-lot.mjs
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
          VINCULUM_API_OWNER: ceo
          PROBE_SKUS: ${{ inputs.skus }}
          PROBE_LOCS: ${{ inputs.locs }}
          SUPABASE_URL: https://idhtjxirqvaensqhozdc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
