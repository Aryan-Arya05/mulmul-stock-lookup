name: Load base from panel exports
on:
  workflow_dispatch:
  push:
    paths: ["data/**"]
concurrency: { group: vinculum-sync, cancel-in-progress: false }
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/load-base.mjs
        env:
          SUPABASE_URL: https://idhtjxirqvaensqhozdc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
