name: Sync Vinculum stock
on:
  schedule:
    - cron: "7 * * * *"        # hourly (a 7-day window takes 15-25 min at Vinculum's page speed)
  workflow_dispatch:
    inputs:
      full_sku_refresh:
        description: "Re-fetch all SKU details from Vinculum"
        type: boolean
        default: false
      backfill_days:
        description: "Backfill: walk back this many days (0 = incremental last 7 days)"
        type: string
        default: "0"
concurrency: { group: vinculum-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync-vinculum.mjs
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
          VINCULUM_API_OWNER: ${{ secrets.VINCULUM_API_OWNER }}
          VINCULUM_ORG_ID: ${{ secrets.VINCULUM_ORG_ID }}
          SUPABASE_URL: https://idhtjxirqvaensqhozdc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL_SKU_REFRESH: ${{ inputs.full_sku_refresh == true && '1' || '' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
