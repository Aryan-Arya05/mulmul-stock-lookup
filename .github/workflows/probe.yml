name: Probe Vinculum API
on:
  workflow_dispatch:
    inputs:
      locs: { description: "Comma-separated location codes", default: "MKM,GGN,JUH,MCS,MNW" }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe.mjs
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
          VINCULUM_API_OWNER: ${{ secrets.VINCULUM_API_OWNER }}
          SUPABASE_URL: https://idhtjxirqvaensqhozdc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROBE_LOCS: ${{ inputs.locs }}
